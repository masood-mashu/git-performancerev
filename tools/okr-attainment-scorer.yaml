name: okr-attainment-scorer
version: 1.0.0
description: "Calculates composite OKR attainment percentage across weighted key result milestones"
input_schema:
  type: object
  properties:
    okr_data_json:
      type: string
      description: "JSON array of objects with weight (float) and completion_pct (float)"
  required:
    - okr_data_json
implementation:
  type: script
  path: okr_attainment_scorer.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
